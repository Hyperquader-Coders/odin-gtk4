# Per-repo settings for scripts/api.sh and scripts/cheatsheet.sh (POSIX sh).
# Everything else in those two scripts is identical in every binding.
REPO=odin-gtk4
PACKAGES="gtk4"
COLLECTION=gtk4
DOC_COLLECTIONS="-collection:gtk4=. -collection:glib=../odin-glib -collection:cairo=../odin-cairo -collection:pango=../odin-pango -collection:graphene=../odin-graphene -collection:pixbuf=../odin-gdk-pixbuf"
INTRO='The reference is the [README](../README.md) and [SPEC](SPEC.md); the short form is the
[cheat sheet](CHEATSHEET.md). GLib, GObject and GIO are odin-glib'\''s, listed in its API.md.'
EXTERNAL_ALIASES="glib=glib gobj=gobject gio=gio"
EXTERNAL_API="${GLIB:-../odin-glib}/docs/API.md"
ALIASES="gtk=gtk4"
PROC_ALIASES='TYPE_FOO class types'
